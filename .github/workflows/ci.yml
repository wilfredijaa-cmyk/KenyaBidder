name: ci
on: {push: {branches: ["**"]}, pull_request: {}}
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: kbtest}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy: {matrix: {db: [duckdb, postgres]}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev,postgres]"
      - name: unit tests (${{ matrix.db }})
        env:
          KENYABIDDER_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://postgres:postgres@127.0.0.1:5432/kbtest' || '' }}
        run: pytest tests --ignore=tests/e2e -q
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -e ".[dev]" playwright && playwright install --with-deps chromium
      - run: pytest tests/e2e -q
        env: {CHROMIUM_PATH: ""}
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e . pip-audit bandit
      - run: pip-audit --strict --progress-spinner off
      - run: bandit -q -r kenyabidder -ll -x tests
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t kenyabidder:ci .
