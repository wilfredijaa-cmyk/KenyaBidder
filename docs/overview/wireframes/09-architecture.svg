<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="system-ui,Segoe UI,Arial,sans-serif"><rect width="1000" height="640" fill="#fff"/><rect x="30" y="90" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="105" y="120" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Web · WhatsApp</text><text x="105" y="138" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">SMS · FastMCP</text><rect x="200" y="90" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="275" y="120" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Channel router</text><text x="275" y="138" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">(agent = identity)</text><rect x="370" y="90" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="445" y="120" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Orchestrator</text><text x="445" y="138" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">pre-filter</text><rect x="540" y="90" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="615" y="120" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Strategy</text><text x="615" y="138" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">baseline·heuristic·LLM</text><rect x="710" y="90" width="150" height="70" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="785" y="120" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Token meter</text><text x="785" y="138" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">(no tokens, no LLM)</text><text x="185" y="130" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">→</text><text x="355" y="130" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">→</text><text x="525" y="130" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">→</text><text x="695" y="130" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">→</text><rect x="200" y="250" width="170" height="70" rx="6" fill="#ecfdf5" stroke="#0b7a4b" stroke-width="1.5"/><text x="285" y="280" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Guardrail interceptor</text><text x="285" y="298" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">(rules, never an LLM)</text><rect x="400" y="250" width="170" height="70" rx="6" fill="#ecfdf5" stroke="#0b7a4b" stroke-width="1.5"/><text x="485" y="280" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Deterministic</text><text x="485" y="298" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">execution engine</text><rect x="600" y="250" width="170" height="70" rx="6" fill="#ecfdf5" stroke="#0b7a4b" stroke-width="1.5"/><text x="685" y="280" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">Auction engine</text><text x="685" y="298" font-size="12" fill="#1f2937" font-weight="600" text-anchor="middle">forward · reverse</text><text x="378" y="290" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">→</text><text x="578" y="290" font-size="20" fill="#6b7280" font-weight="400" text-anchor="start">→</text><text x="600" y="200" font-size="12" fill="#6b7280" font-weight="400" text-anchor="start">LLM proposal (untrusted input)  ↓</text><rect x="200" y="380" width="570" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="485" y="416" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Match service → confirm → contact reveal → outcome → dispute → reputation</text><rect x="200" y="460" width="570" height="60" rx="6" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="485" y="496" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">DuckDB (PostgreSQL-ready): ledger · orders · state · backups   |   /metrics /readyz</text><rect x="30" y="545" width="940" height="26" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="40" y="563" font-size="11" fill="#92400e" font-weight="400" text-anchor="start">Tools an LLM can call are read-only and assigned per agent; state-changing tools exist only on the internal server. Tool output and listing text are untrusted data.</text><text x="20" y="626" font-size="12" fill="#6b7280">How a bid happens — the LLM proposes, rules and a deterministic engine decide</text></svg>