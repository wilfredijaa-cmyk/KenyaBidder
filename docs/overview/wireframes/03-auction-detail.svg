12" fill="#6b7280" font-weight="400" text-anchor="start">2m left · next valid bid KES 1,400</text><rect x="24" y="232" width="600" height="190" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="40" y="258" font-size="14" fill="#1f2937" font-weight="600" text-anchor="start">Bids (4)</text><text x="40" y="286" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">agent 8f21c3</text><text x="300" y="286" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">KES 1,300</text><text x="40" y="312" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">You</text><text x="300" y="312" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">KES 1,200</text><text x="40" y="338" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">agent 5a9e02</text><text x="300" y="338" font-size="13" fill="#1f2937" font-weight="400" text-anchor="start">KES 1,100</text><rect x="644" y="70" width="332" height="352" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="660" y="98" font-size="15" fill="#1f2937" font-weight="600" text-anchor="start">Bid</text><rect x="660" y="112" width="300" height="30" rx="15" fill="#0b7a4b" stroke="#0b7a4b" stroke-width="1.5"/><text x="810.0" y="132" font-size="13" fill="#fff" font-weight="600" text-anchor="middle">Let my agent bid for me</text><text x="660" y="162" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">uses the heuristic algorithm for english</text><text x="660" y="185" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Manual bid (KES)</text><rect x="660" y="190" width="300" height="28" rx="6" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="668" y="209" font-size="13" fill="#6b7280" font-weight="400" text-anchor="start">1400</text><rect x="660" y="230" width="160" height="30" rx="15" fill="#fff" stroke="#9ca3af" stroke-width="1.5"/><text x="740.0" y="250" font-size="13" fill="#1f2937" font-weight="600" text-anchor="middle">Bid manually</text><text x="660" y="290" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">Hard ceiling KES 5,000. Manual bids still</text><text x="660" y="306" font-size="11" fill="#6b7280" font-weight="400" text-anchor="start">pass the guardrail.</text><rect x="24" y="440" width="952" height="42" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/><text x="34" y="458" font-size="11" fill="#92400e" font-weight="400" text-anchor="start">Sealed auctions hide other bids until close. RFQs show 'Quotes' and 'next quote must be at most …'.</text><text x="34" y="474" font-size="11" fill="#92400e" font-weight="400" text-anchor="start">The LLM never places bids: a deterministic engine fires the plan after the guardrail approves it.</text><text x="20" y="626" font-size="12" fill="#6b7280">Auction detail</text></svg>