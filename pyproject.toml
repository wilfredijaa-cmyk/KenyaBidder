[project]
name = "kenyabidder"
version = "0.2.0"
description = "AI auction matchmaking: seller/bidder agents, deterministic execution harness, FastMCP tool servers, NiceGUI console"
requires-python = ">=3.11"
dependencies = [
  "nicegui>=3.0",
  "fastmcp>=4.0",
  "anthropic>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
kenyabidder = "kenyabidder.__main__:main"

[tool.setuptools.packages.find]
include = ["kenyabidder*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
